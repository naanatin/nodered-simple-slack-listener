<script type="text/javascript">
    RED.nodes.registerType('slack-config', {
        category: 'config',

        defaults: {
            name: { value: '' },
            mode: { value: 'socket' }
        },

        credentials: {
            botToken: { type: 'password' },
            appToken: { type: 'password' },
            signingSecret: { type: 'password' }
        },

        oneditprepare: function () {
            var modeSel = $("#node-config-input-mode");
            function updateMode() {
                if (modeSel.val() === "socket") {
                    $("#node-config-input-appToken").closest(".form-row").show();
                    $("#node-config-input-signingSecret").closest(".form-row").hide();
                } else {
                    $("#node-config-input-appToken").closest(".form-row").hide();
                    $("#node-config-input-signingSecret").closest(".form-row").show();
                }
            }
            modeSel.change(updateMode);
            updateMode();
        },

        label: function () {
            return this.name || 'Slack Config';
        }
    });
</script>

<script type="text/html" data-template-name="slack-config">
    <div class="form-row">
        <label for="node-config-input-name">Name</label>
        <input type="text" id="node-config-input-name">
    </div>

    <div class="form-row">
        <label for="node-config-input-mode">Mode</label>
        <select id="node-config-input-mode">
            <option value="socket">Socket Mode</option>
            <option value="http">HTTP Mode (experimental)</option>
        </select>
    </div>

    <div class="form-row">
        <label for="node-config-input-botToken">Bot Token</label>
        <input type="password" id="node-config-input-botToken">
    </div>

    <div class="form-row">
        <label for="node-config-input-appToken">App Token</label>
        <input type="password" id="node-config-input-appToken">
    </div>

    <div class="form-row">
        <label for="node-config-input-signingSecret">Signing Secret</label>
        <input type="password" id="node-config-input-signingSecret">
    </div>
</script>
