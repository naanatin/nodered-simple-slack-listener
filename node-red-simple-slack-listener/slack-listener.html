<script type="text/javascript">
RED.nodes.registerType('slack-listener', {
    category: 'network',
    color: '#FFCC66',
    icon: 'slack.svg',

    defaults: {
        name: { value: '' },

        slack: {
            type: 'slack-config',
            required: true
        }
    },

    inputs: 0,
    outputs: 1,

    label: function () {
        return this.name || 'Simple Slack Listener';
    }
});
</script>

<script type="text/html" data-template-name="slack-listener">

    <div class="form-row">
        <label for="node-input-name">
            Name
        </label>
        <input type="text" id="node-input-name">
    </div>

    <div class="form-row">
        <label for="node-input-slack">
            Slack Config
        </label>
        <input type="text" id="node-input-slack">
    </div>

</script>
